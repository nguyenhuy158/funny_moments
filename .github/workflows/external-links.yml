name: External Link Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  external-links:
    name: Check external links
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.152.2"
          extended: true

      - name: Build production site
        run: hugo --buildDrafts=false --buildFuture=false --gc --cleanDestinationDir --minify --baseURL "https://huyab.click"

      - name: Check external links
        run: python3 scripts/check_links.py public --external --timeout 15
