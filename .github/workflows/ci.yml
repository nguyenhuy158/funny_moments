name: CI

on:
  pull_request:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content-lint:
    name: Content lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint content metadata
        shell: bash
        run: python3 scripts/lint_content.py

  shell-sanity:
    name: Shell script sanity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate shell scripts
        shell: bash
        run: |
          bash -n build.sh
          bash -n deploy.sh
          bash -n dev.sh
          bash -n setup.sh

  hugo-build:
    name: Hugo build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.152.2"
          extended: true

      - name: Resolve production base URL
        id: base-url
        shell: bash
        run: |
          if [ -f CNAME ]; then
            BASE_URL="https://$(tr -d '\n' < CNAME)"
          else
            BASE_URL="/"
          fi

          echo "value=${BASE_URL}" >> "${GITHUB_OUTPUT}"

      - name: Build site
        shell: bash
        run: |
          hugo \
            --buildDrafts=false \
            --buildFuture=false \
            --gc \
            --cleanDestinationDir \
            --minify \
            --baseURL "${{ steps.base-url.outputs.value }}"

      - name: Upload public artifact
        uses: actions/upload-artifact@v4
        with:
          name: public-site
          path: public

  public-output-audit:
    name: Public output audit
    runs-on: ubuntu-latest
    needs:
      - hugo-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download public artifact
        uses: actions/download-artifact@v4
        with:
          name: public-site
          path: public

      - name: Audit built output
        shell: bash
        run: python3 scripts/check_public.py public

  internal-link-audit:
    name: Internal link audit
    runs-on: ubuntu-latest
    needs:
      - hugo-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download public artifact
        uses: actions/download-artifact@v4
        with:
          name: public-site
          path: public

      - name: Audit internal links
        shell: bash
        run: python3 scripts/check_links.py public

  cloudflare-build-parity:
    name: Cloudflare build parity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Cloudflare build script
        shell: bash
        env:
          HUGO_BASE_URL: https://profile.huyab.click
        run: |
          chmod a+x build.sh
          ./build.sh

      - name: Audit Cloudflare build output
        shell: bash
        run: python3 scripts/check_public.py public
