name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to build, for example v1.2.3"
        required: true

permissions:
  contents: write

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.resolve-tag.outputs.release_tag }}
      is_prerelease: ${{ steps.classify-tag.outputs.is_prerelease }}
    steps:
      - name: Resolve release tag
        id: resolve-tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            RELEASE_TAG="${INPUT_TAG}"
          else
            RELEASE_TAG="${REF_NAME}"
          fi

          if [ -z "${RELEASE_TAG}" ]; then
            echo "Release tag could not be determined."
            exit 1
          fi

          echo "release_tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Enforce tag naming rule
        env:
          RELEASE_TAG: ${{ steps.resolve-tag.outputs.release_tag }}
        run: |
          TAG_PATTERN='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'

          if ! printf '%s\n' "${RELEASE_TAG}" | grep -Eq "${TAG_PATTERN}"; then
            echo "Invalid release tag: ${RELEASE_TAG}"
            echo "Expected format: vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-suffix"
            exit 1
          fi

      - name: Mark prerelease tags
        id: classify-tag
        env:
          RELEASE_TAG: ${{ steps.resolve-tag.outputs.release_tag }}
        run: |
          case "${RELEASE_TAG}" in
            *-*)
              echo "is_prerelease=true" >> "${GITHUB_OUTPUT}"
              ;;
            *)
              echo "is_prerelease=false" >> "${GITHUB_OUTPUT}"
              ;;
          esac

  build-release:
    name: Build release artifact
    runs-on: ubuntu-latest
    needs: validate-tag
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.152.2"
          extended: true

      - name: Lint content metadata
        run: python3 scripts/lint_content.py

      - name: Build production site
        run: hugo --buildDrafts=false --buildFuture=false --minify

      - name: Include custom domain file
        run: |
          if [ -f CNAME ]; then
            cp CNAME public/CNAME
          fi

      - name: Package release artifact
        env:
          RELEASE_TAG: ${{ needs.validate-tag.outputs.release_tag }}
        run: |
          tar -czf "funny-moments-${RELEASE_TAG}.tar.gz" public

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: funny-moments-${{ needs.validate-tag.outputs.release_tag }}
          path: funny-moments-${{ needs.validate-tag.outputs.release_tag }}.tar.gz

  publish-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs:
      - validate-tag
      - build-release
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: funny-moments-${{ needs.validate-tag.outputs.release_tag }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate-tag.outputs.release_tag }}
          generate_release_notes: true
          prerelease: ${{ needs.validate-tag.outputs.is_prerelease == 'true' }}
          files: funny-moments-${{ needs.validate-tag.outputs.release_tag }}.tar.gz
