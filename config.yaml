baseURL: "/"
languageCode: "en-us"
title: "Build, Break, Learn"
theme: "papermod"

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

defaultContentLanguage: en
languages:
  en:
    languageName: English
    languageCode: en-US
    weight: 1
  vi:
    languageName: Tiếng Việt
    languageCode: vi-VN
    weight: 2

params:
  env: production
  title: "Build, Break, Learn"
  headTitle: "Build, Break, Learn"
  subtitle: "Tech notes, experiments, and useful fixes."
  contact:
    email: huy.ntq02@gmail.com
    # phone: +08123456789
  description: "Personal blog about tech, tools, experiments, and practical fixes."
  mainSections:
    - "posts"
    - "notes"
  author: "Huy Nguyen"
  defaultTheme: "auto"
  keywords: [Tech, Blog, Hugo, DevOps, Notes]
  images: ["/images/sea.png"]
  DateFormat: "02/01/06"

  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: false
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: false

  disableCopyright: true
  hideFooter: false

  showSearch: true
  ShowLanguageSwitcher: true

  assets:
    disableHLJS: false
    disableFingerprinting: false
#   assets:
    # disableHLJS: true # to disable highlight.js
    # disableFingerprinting: true
    favicon: "images/sea.png"
    favicon16x16: "images/sea.png"
    favicon32x32: "images/sea.png"
    apple_touch_icon: "images/sea.png"
    safari_pinned_tab: "images/sea.png"

  # Use built-in Fuse.js search
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 100
    threshold: 0.4
    minMatchCharLength: 2
    keys: ["title", "permalink", "summary", "content"]

  label:
    # text: "Home"
    icon: images/sea.png
    iconHeight: 35

  homeInfoParams:
    ShowShareButtons: true
    ShareButtons: ["linkedin", "twitter"]
    Title: "Hi, I'm Huy."
    Content: "I write about tech, tools, experiments, and small useful tricks."

  socialIcons:
    - name: "Github"
      url: "https://github.com/nguyenhuy158"
    - name: "Youtube"
      url: "https://youtube.com/@ntqhuy2k2"
    - name: "Linkedin"
      url: "https://www.linkedin.com/in/nguyenhuy158"
    - name: "daily.dev"
      url: "https://app.daily.dev/nguyenhuy158"
    - name: "gitlab"
      url: "https://gitlab.com/huy.ntq02"

  schema:
    publisherType: Person
    sameAs:
      - "https://github.com/nguyenhuy158"
      - "https://youtube.com/@ntqhuy2k2"
      - "https://www.linkedin.com/in/nguyenhuy158"
      - "https://app.daily.dev/nguyenhuy158"
      - "https://gitlab.com/huy.ntq02"

  # for search
  # https://fusejs.io/api/options.html
#   fuseOpts:
#     isCaseSensitive: false
#     shouldSort: true
#     location: 0
#     distance: 1000
#     threshold: 0.4
#     minMatchCharLength: 0
#     limit: 10 # refer: https://www.fusejs.io/api/methods.html#search
#     keys: ["title", "permalink", "summary", "content"]


menu:
  main:
    - name: About
      url: /about/
      weight: 1
    - name: Uses
      url: /uses/
      weight: 2
    - name: Archive
      url: archives
      weight: 3
    - name: Search
      url: search/
      weight: 4
    - name: Taxonomies
      url: /taxonomies/
      weight: 5
    - name: Github
      url: https://github.com/nguyenhuy158
      weight: 6

pygmentsUseClasses: true

markup:
  highlight:
    noClasses: false
    # anchorLineNos: true
    # codeFences: true
    # guessSyntax: true
    # lineNos: true
    # style: monokai

pagination:
  pagerSize: 10

outputs:
  home:
    - HTML
    - RSS
    - JSON

services:
  googleAnalytics:
    ID: G-RJV6SMGLFR

HTTPCache:
  polls:
  - disable: true
    for:
      excludes: []
      includes:
      - '**'
    high: 0s
    low: 0s
