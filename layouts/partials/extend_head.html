{{- range site.Params.socialIcons }}
<link rel="me" href="{{ .url }}">
{{- end }}

<style>
  .search-status {
    margin: 0.75rem 0 1rem;
    color: var(--secondary);
    font-size: 0.95rem;
  }

  .search-hint {
    display: inline-block;
    margin-left: 0.5rem;
  }

  .searchResults {
    display: grid;
    gap: 0.9rem;
    padding: 0;
  }

  .search-result-item {
    list-style: none;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--theme);
    transition: border-color 0.2s ease, transform 0.2s ease;
  }

  .search-result-item:hover,
  .search-result-item.focus {
    border-color: var(--tertiary);
    transform: translateY(-1px);
  }

  .search-result-item .entry-link {
    display: grid;
    gap: 0.45rem;
    padding: 1rem 1.1rem;
    text-decoration: none;
  }

  .search-result-title {
    font-size: 1rem;
    font-weight: 650;
    color: var(--primary);
  }

  .search-result-meta {
    color: var(--secondary);
    font-size: 0.85rem;
  }

  .search-result-snippet {
    color: var(--content);
    font-size: 0.92rem;
    line-height: 1.65;
  }

  .searchResults mark {
    background: color-mix(in srgb, var(--primary) 22%, transparent);
    color: inherit;
    border-radius: 0.3rem;
    padding: 0.05rem 0.2rem;
  }

  .post-freshness {
    margin-top: 1rem;
    padding: 0.9rem 1rem;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: color-mix(in srgb, var(--theme) 82%, var(--code-bg) 18%);
  }

  .post-freshness.is-stale {
    border-color: color-mix(in srgb, #d97706 45%, var(--border));
    background: color-mix(in srgb, #d97706 9%, var(--theme));
  }

  .post-freshness-meta,
  .post-freshness-warning {
    margin: 0;
    font-size: 0.94rem;
    line-height: 1.6;
  }

  .post-freshness-warning {
    margin-top: 0.45rem;
  }

  .post-content img:not(.in-text) {
    cursor: zoom-in;
  }

  .image-lightbox {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    background: rgba(10, 12, 16, 0.88);
  }

  .image-lightbox.is-open {
    display: flex;
  }

  .image-lightbox__button {
    position: absolute;
    top: 1rem;
    right: 1rem;
    border: 0;
    border-radius: 999px;
    padding: 0.65rem 0.9rem;
    background: rgba(255, 255, 255, 0.12);
    color: #fff;
    font: inherit;
    cursor: pointer;
  }

  .image-lightbox__figure {
    margin: 0;
    max-width: min(1100px, 100%);
    max-height: 100%;
    display: grid;
    gap: 0.85rem;
    justify-items: center;
  }

  .image-lightbox__image {
    max-width: 100%;
    max-height: calc(100vh - 9rem);
    border-radius: 16px;
    box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
  }

  .image-lightbox__caption {
    color: rgba(255, 255, 255, 0.92);
    text-align: center;
    font-size: 0.95rem;
    line-height: 1.6;
  }

  .footer-links {
    display: inline-flex;
    flex-wrap: wrap;
    gap: 0.35rem;
    justify-content: center;
  }

  @media (max-width: 767px) {
    .image-lightbox {
      padding: 1rem;
    }

    .image-lightbox__image {
      max-height: calc(100vh - 7rem);
    }
  }
</style>

{{- if .IsHome }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": {{ site.Title }},
  "url": {{ .Permalink }},
  "description": {{ site.Params.description | plainify }},
  "inLanguage": [
    "en-US",
    "vi-VN"
  ],
  "potentialAction": {
    "@type": "SearchAction",
    "target": {{ printf "%ssearch/?q={search_term_string}" .Permalink }},
    "query-input": "required name=search_term_string"
  }
}
</script>
{{- end }}
