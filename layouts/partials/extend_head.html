{{- range site.Params.socialIcons }}
<link rel="me" href="{{ .url }}">
{{- end }}

<style>
  .search-status {
    margin: 0.75rem 0 1rem;
    color: var(--secondary);
    font-size: 0.95rem;
  }

  .search-hint {
    display: inline-block;
    margin-left: 0.5rem;
  }

  .searchResults {
    display: grid;
    gap: 0.9rem;
    padding: 0;
  }

  .search-result-item {
    list-style: none;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--theme);
    transition: border-color 0.2s ease, transform 0.2s ease;
  }

  .search-result-item:hover,
  .search-result-item.focus {
    border-color: var(--tertiary);
    transform: translateY(-1px);
  }

  .search-result-item .entry-link {
    display: grid;
    gap: 0.45rem;
    padding: 1rem 1.1rem;
    text-decoration: none;
  }

  .search-result-title {
    font-size: 1rem;
    font-weight: 650;
    color: var(--primary);
  }

  .search-result-meta {
    color: var(--secondary);
    font-size: 0.85rem;
  }

  .search-result-snippet {
    color: var(--content);
    font-size: 0.92rem;
    line-height: 1.65;
  }

  .searchResults mark {
    background: color-mix(in srgb, var(--primary) 22%, transparent);
    color: inherit;
    border-radius: 0.3rem;
    padding: 0.05rem 0.2rem;
  }

  .post-freshness {
    margin-top: 1rem;
    padding: 0.9rem 1rem;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: color-mix(in srgb, var(--theme) 82%, var(--code-bg) 18%);
  }

  .post-freshness.is-stale {
    border-color: color-mix(in srgb, #d97706 45%, var(--border));
    background: color-mix(in srgb, #d97706 9%, var(--theme));
  }

  .post-freshness-meta,
  .post-freshness-warning {
    margin: 0;
    font-size: 0.94rem;
    line-height: 1.6;
  }

  .post-freshness-warning {
    margin-top: 0.45rem;
  }

  .post-content img:not(.in-text) {
    cursor: zoom-in;
  }

  .image-lightbox {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    background: rgba(10, 12, 16, 0.88);
  }

  .image-lightbox.is-open {
    display: flex;
  }

  .image-lightbox__button {
    position: absolute;
    top: 1rem;
    right: 1rem;
    border: 0;
    border-radius: 999px;
    padding: 0.65rem 0.9rem;
    background: rgba(255, 255, 255, 0.12);
    color: #fff;
    font: inherit;
    cursor: pointer;
  }

  .image-lightbox__figure {
    margin: 0;
    max-width: min(1100px, 100%);
    max-height: 100%;
    display: grid;
    gap: 0.85rem;
    justify-items: center;
  }

  .image-lightbox__image {
    max-width: 100%;
    max-height: calc(100vh - 9rem);
    border-radius: 16px;
    box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
  }

  .image-lightbox__caption {
    color: rgba(255, 255, 255, 0.92);
    text-align: center;
    font-size: 0.95rem;
    line-height: 1.6;
  }

  .footer-links {
    display: inline-flex;
    flex-wrap: wrap;
    gap: 0.35rem;
    justify-content: center;
  }

  .content-badge {
    display: inline-flex;
    align-items: center;
    width: fit-content;
    margin: 0 0 0.55rem;
    padding: 0.28rem 0.62rem;
    border-radius: 999px;
    background: color-mix(in srgb, var(--tertiary) 18%, var(--entry));
    color: var(--secondary);
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .entry-header__row {
    display: grid;
    gap: 0.25rem;
  }

  .related-content {
    margin: 2.25rem 0 0;
    display: grid;
    gap: 1rem;
  }

  .related-content__eyebrow {
    margin: 0 0 0.55rem;
    color: var(--secondary);
    font-size: 0.82rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .related-content__card,
  .related-content__list a {
    display: grid;
    gap: 0.45rem;
    padding: 1rem 1.05rem;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: var(--entry);
    text-decoration: none;
    transition: border-color 0.2s ease, transform 0.2s ease;
  }

  .related-content__card:hover,
  .related-content__list a:hover {
    border-color: var(--tertiary);
    transform: translateY(-1px);
  }

  .related-content__card strong,
  .related-content__list span {
    color: var(--primary);
    line-height: 1.4;
  }

  .related-content__card > span:last-child {
    color: var(--secondary);
    font-size: 0.92rem;
    line-height: 1.6;
  }

  .related-content__list ul {
    display: grid;
    gap: 0.75rem;
    padding: 0;
    margin: 0;
  }

  .related-content__list li {
    list-style: none;
  }

  .taxonomy-summary {
    margin: 0.2rem 0 1rem;
    color: var(--secondary);
    font-size: 0.95rem;
  }

  .terms-tags--top {
    margin-bottom: 0.9rem;
  }

  .taxonomy-more {
    border: 1px solid var(--border);
    border-radius: 16px;
    background: color-mix(in srgb, var(--theme) 86%, var(--code-bg) 14%);
    padding: 0.9rem 1rem;
  }

  .taxonomy-more summary {
    cursor: pointer;
    font-weight: 600;
    color: var(--primary);
  }

  .taxonomy-more .terms-tags {
    margin-top: 1rem;
  }

  .lang-switch-link {
    padding: 0 !important;
  }

  .lang-switch-chip {
    display: inline-flex;
    align-items: center;
    gap: 0.38rem;
    padding: 0.42rem 0.68rem;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--entry);
    color: var(--primary);
    line-height: 1;
    transition: border-color 0.2s ease, transform 0.2s ease, background 0.2s ease;
  }

  .lang-switch-link:hover .lang-switch-chip,
  .lang-switch-link:focus-visible .lang-switch-chip {
    border-color: var(--tertiary);
    background: color-mix(in srgb, var(--tertiary) 12%, var(--entry));
    transform: translateY(-1px);
  }

  .lang-switch-icon {
    width: 0.95rem;
    height: 0.95rem;
    flex: 0 0 auto;
  }

  .lang-switch-label {
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.06em;
  }

  @media (max-width: 767px) {
    .header-nav {
      display: grid;
      grid-template-columns: 1fr;
      align-items: start;
      row-gap: 0.9rem;
      line-height: 1.25;
      padding-top: 0.95rem;
      padding-bottom: 0.55rem;
    }

    .logo {
      width: 100%;
      justify-content: space-between;
      align-items: flex-start;
      column-gap: 0.8rem;
      row-gap: 0.65rem;
    }

    .logo a {
      max-width: calc(100% - 6.5rem);
      font-size: clamp(1.45rem, 6vw, 1.8rem);
      line-height: 1.1;
      align-items: flex-start;
      column-gap: 0.5rem;
    }

    .logo a img,
    .logo a svg {
      margin-top: 0.05rem;
      height: 28px;
    }

    .logo-switches {
      margin-left: auto;
      align-self: flex-start;
      gap: 0.2rem;
    }

    .lang-switch-chip {
      padding: 0.44rem 0.62rem;
    }

    .menu {
      width: 100%;
      margin: 0;
      padding: 0 0 0.3rem;
      column-gap: 0.55rem;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .menu::-webkit-scrollbar {
      display: none;
    }

    .menu li {
      flex: 0 0 auto;
    }

    .menu a {
      font-size: 0.94rem;
      line-height: 1;
      padding: 0.72rem 0.95rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--entry);
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.02);
    }

    .menu .active {
      text-decoration: none;
      text-underline-offset: 0;
      background: color-mix(in srgb, var(--tertiary) 18%, var(--entry));
      border-radius: 999px;
      padding: 0.72rem 0.95rem;
    }

    .page-header,
    .post-header {
      margin-top: 18px;
    }

    .page-header h1,
    .post-title {
      font-size: clamp(2rem, 8vw, 2.65rem);
      line-height: 1.12;
    }

    .post-description {
      font-size: 0.98rem;
      line-height: 1.65;
    }

    .post-meta,
    .breadcrumbs {
      line-height: 1.55;
    }

    .first-entry {
      min-height: unset;
      padding: 1.1rem;
      margin-bottom: 1.25rem;
    }

    .first-entry .entry-header h1,
    .first-entry .entry-header h2 {
      font-size: clamp(1.75rem, 7vw, 2.2rem);
      line-height: 1.15;
    }

    .post-entry {
      padding: 16px 15px;
      border-radius: 18px;
    }

    .entry-header h2 {
      font-size: 1.28rem;
      line-height: 1.25;
    }

    .entry-content {
      font-size: 0.93rem;
      -webkit-line-clamp: 3;
    }

    .post-content {
      margin: 22px 0;
    }

    .post-content pre {
      margin-inline: calc(var(--gap) * -0.45);
      border-radius: 14px;
    }

    .post-content table {
      display: block;
      overflow-x: auto;
      width: 100%;
    }

    .searchbox input {
      padding: 0.85rem 1rem;
      font-size: 16px;
    }

    .search-status {
      margin-top: 0.7rem;
      font-size: 0.9rem;
      line-height: 1.55;
    }

    .search-result-item .entry-link {
      padding: 0.95rem 1rem;
    }

    .search-result-title {
      font-size: 0.98rem;
      line-height: 1.4;
    }

    .related-content__card,
    .related-content__list a {
      padding: 0.92rem 0.95rem;
      border-radius: 14px;
    }

    .search-result-meta {
      font-size: 0.8rem;
      word-break: break-word;
    }

    .search-result-snippet {
      font-size: 0.89rem;
      line-height: 1.58;
    }

    .terms-tags {
      gap: 0.65rem;
    }

    .terms-tags a,
    .post-tags a {
      padding: 0.48rem 0.78rem;
      line-height: 1.3;
    }

    .footer {
      line-height: 1.65;
      padding-bottom: max(0.85rem, env(safe-area-inset-bottom));
    }

    .footer-links {
      row-gap: 0.4rem;
    }

    .image-lightbox {
      padding: 1rem;
    }

    .image-lightbox__image {
      max-height: calc(100vh - 7rem);
    }
  }

  @media (max-width: 480px) {
    .logo a {
      max-width: calc(100% - 5.6rem);
      font-size: clamp(1.28rem, 6.8vw, 1.55rem);
    }

    .theme-toggle {
      padding-inline: 0.25rem;
    }

    .nav-sep {
      display: none;
    }

    .lang-menu a {
      padding-inline: 0;
      font-size: 0.94rem;
    }

    .menu a,
    .menu .active {
      padding: 0.64rem 0.82rem;
      font-size: 0.9rem;
    }

    .page-header h1,
    .post-title {
      font-size: clamp(1.8rem, 8.5vw, 2.2rem);
    }

    .post-entry {
      padding: 14px 13px;
    }

    .post-content pre {
      margin-inline: calc(var(--gap) * -0.25);
    }
  }

  /* --- Accent color system ------------------------------------------- */
  :root {
    --accent: #4f46e5;
    --accent-strong: #4338ca;
    --accent-contrast: #ffffff;
  }

  .dark {
    --accent: #818cf8;
    --accent-strong: #a5b4fc;
    --accent-contrast: #16171d;
  }

  a {
    text-underline-offset: 0.2em;
  }

  .post-content a {
    color: var(--accent);
    text-decoration-color: color-mix(in srgb, var(--accent) 45%, transparent);
  }

  .post-content a:hover {
    color: var(--accent-strong);
    text-decoration-color: var(--accent-strong);
  }

  #menu .active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  .menu .active {
    background: color-mix(in srgb, var(--accent) 16%, var(--entry));
    color: var(--accent);
  }

  .theme-toggle:hover,
  .lang-switch-link:hover .lang-switch-chip,
  .lang-switch-link:focus-visible .lang-switch-chip {
    color: var(--accent);
    border-color: var(--accent);
  }

  .terms-tags a,
  .post-tags a {
    background: color-mix(in srgb, var(--accent) 14%, var(--entry));
    color: var(--accent);
  }

  .terms-tags a:hover,
  .terms-tags a:active,
  .post-tags a:hover {
    background: var(--accent);
    color: var(--accent-contrast);
    transform: translateY(-1px);
  }

  .social-icons a {
    border-radius: 999px;
    transition: color 0.15s ease, background 0.15s ease, transform 0.15s ease;
  }

  .social-icons a:hover {
    color: var(--accent);
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    transform: translateY(-1px);
  }

  .post-entry,
  .search-result-item,
  .related-content__card,
  .related-content__list a,
  .taxonomy-more {
    transition: border-color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
  }

  .post-entry:hover {
    border-color: color-mix(in srgb, var(--accent) 45%, var(--border));
    box-shadow: 0 10px 28px -18px color-mix(in srgb, var(--accent) 60%, transparent);
    transform: translateY(-2px);
  }

  .home-info {
    padding: calc(var(--gap) * 1.15) calc(var(--gap) * 1.25);
    border: 1px solid var(--border);
    border-radius: 18px;
    background: color-mix(in srgb, var(--accent) 5%, var(--entry));
    border-left: 3px solid var(--accent);
  }

  .home-info .entry-header h1 {
    font-size: clamp(1.9rem, 4.5vw, 2.4rem);
    letter-spacing: -0.01em;
  }

  .top-link {
    background: var(--accent) !important;
    color: var(--accent-contrast);
    box-shadow: 0 8px 20px -10px color-mix(in srgb, var(--accent) 70%, transparent);
  }

  hr {
    background: color-mix(in srgb, var(--accent) 35%, var(--border)) !important;
  }

  ::-webkit-scrollbar-thumb {
    background: color-mix(in srgb, var(--accent) 55%, var(--tertiary)) !important;
  }

  ::selection {
    background: color-mix(in srgb, var(--accent) 35%, transparent);
  }

  .searchbox input:focus,
  #searchResults .focus {
    border-color: var(--accent) !important;
  }

  .lang-switch-icon,
  .content-badge {
    color: var(--accent);
  }
</style>

{{- if .IsHome }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": {{ site.Title }},
  "url": {{ .Permalink }},
  "description": {{ site.Params.description | plainify }},
  "inLanguage": [
    "en-US",
    "vi-VN"
  ],
  "potentialAction": {
    "@type": "SearchAction",
    "target": {{ printf "%ssearch/?q={search_term_string}" .Permalink }},
    "query-input": "required name=search_term_string"
  }
}
</script>
{{- end }}
